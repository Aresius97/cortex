<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CORTEX — Investigation Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --deep-space:#080C11;
    --slate:#12181F;
    --panel:#1A232D;
    --line:#2A3542;
    --amber:#E8A33D;
    --teal:#3FA796;
    --crimson:#C4432B;
    --steel:#8B9AA8;
    --paper:#EDE6D6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,0.05), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(63,167,150,0.04), transparent 55%),
      var(--deep-space);
    color:#DDE3E8;
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.9rem;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber); color:var(--deep-space); }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  h1,h2,h3{ font-family:'Archivo', sans-serif; letter-spacing:-0.02em; font-weight:900; }
  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }

  #app{ max-width:1240px; margin:0 auto; padding:0 28px 90px; }

  /* ── HEADER ─────────────────────────────────────────────── */
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 0 18px; border-bottom:1px solid var(--line);
    flex-wrap:wrap; gap:12px;
  }
  .brand{ 
    display:flex; align-items:center; gap:14px;
    position:relative;
  }
  .brand .mark{
    width:52px; 
    height:52px; 
    border:2px solid var(--amber); 
    border-radius:10px;
    display:flex; 
    align-items:center; 
    justify-content:center;
    background:rgba(232,163,61,0.08);
    box-shadow: 0 0 30px rgba(232,163,61,0.15), inset 0 0 30px rgba(232,163,61,0.05);
    transition: all 0.3s ease;
    flex-shrink:0;
    position:relative;
  }
  .brand .mark::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 14px;
    border: 1px solid rgba(232,163,61,0.2);
    animation: logoPulse 3s ease-in-out infinite;
  }
  @keyframes logoPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.04); }
  }
  .brand .mark:hover {
    box-shadow: 0 0 50px rgba(232,163,61,0.3), inset 0 0 50px rgba(232,163,61,0.08);
    transform: scale(1.02);
  }
  /* ── CORTEX LOGO MARK ── */
  .logo-mark {
    width: 38px;
    height: 38px;
    position: relative;
  }
  .logo-mark .outer-ring {
    position: absolute;
    inset: 0;
    border: 2px solid var(--amber);
    border-radius: 50%;
    opacity: 0.6;
  }
  .logo-mark .inner-ring {
    position: absolute;
    inset: 6px;
    border: 1.5px solid var(--amber);
    border-radius: 50%;
    opacity: 0.4;
  }
  .logo-mark .center-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(232,163,61,0.6);
  }
  .logo-mark .line-h {
    position: absolute;
    top: 50%;
    left: 20%;
    right: 20%;
    height: 1.5px;
    background: var(--amber);
    transform: translateY(-50%);
    opacity: 0.5;
  }
  .logo-mark .line-v {
    position: absolute;
    left: 50%;
    top: 20%;
    bottom: 20%;
    width: 1.5px;
    background: var(--amber);
    transform: translateX(-50%);
    opacity: 0.5;
  }
  .logo-mark .node {
    position: absolute;
    width: 5px;
    height: 5px;
    background: var(--amber);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(232,163,61,0.4);
  }
  .logo-mark .node-tl { top: 3px; left: 3px; }
  .logo-mark .node-tr { top: 3px; right: 3px; }
  .logo-mark .node-bl { bottom: 3px; left: 3px; }
  .logo-mark .node-br { bottom: 3px; right: 3px; }
  .logo-mark .node-l { top: 50%; left: 3px; transform: translateY(-50%); }
  .logo-mark .node-r { top: 50%; right: 3px; transform: translateY(-50%); }
  .logo-mark .node-t { top: 3px; left: 50%; transform: translateX(-50%); }
  .logo-mark .node-b { bottom: 3px; left: 50%; transform: translateX(-50%); }
  /* Node pulsing animation */
  .logo-mark .node {
    animation: nodePulse 2.5s ease-in-out infinite;
  }
  .logo-mark .node:nth-child(2) { animation-delay: 0.15s; }
  .logo-mark .node:nth-child(3) { animation-delay: 0.3s; }
  .logo-mark .node:nth-child(4) { animation-delay: 0.45s; }
  .logo-mark .node:nth-child(5) { animation-delay: 0.6s; }
  .logo-mark .node:nth-child(6) { animation-delay: 0.75s; }
  .logo-mark .node:nth-child(7) { animation-delay: 0.9s; }
  .logo-mark .node:nth-child(8) { animation-delay: 1.05s; }
  .logo-mark .node:nth-child(9) { animation-delay: 1.2s; }
  @keyframes nodePulse {
    0%, 100% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  .brand .name-group {
    display:flex;
    flex-direction:column;
    line-height:1;
  }
  .brand .name{ 
    font-size:28px; 
    letter-spacing:0.02em; 
    font-family:'Archivo';
    font-weight:900;
    background: linear-gradient(135deg, #F4C066, var(--amber), #F4C066);
    background-size: 200% 200%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation: shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .brand .tag{ 
    font-family:'IBM Plex Mono'; 
    font-size:11px; 
    color:var(--steel); 
    letter-spacing:0.08em; 
    padding-top:4px;
    text-transform:uppercase;
  }
  .ticker{ display:flex; gap:24px; font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--steel); flex-wrap:wrap; }
  .ticker b{ color:#DDE3E8; font-weight:600; }
  .ticker .dot{ color:var(--amber); display:inline-block; animation:pulseDot 2s infinite; }

  /* ── FIVE ACT NAV ───────────────────────────────────────── */
  nav.acts{
    display:flex; gap:2px; margin:26px 0 0; overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  .act-tab{
    flex:1; min-width:150px; padding:14px 16px 12px; cursor:pointer;
    border-bottom:2px solid transparent; position:relative; transition:all 0.3s ease-in-out;
    display:flex; align-items:center; gap:9px; white-space:nowrap;
  }
  .act-tab:hover .act-tab-title{ color:var(--amber); }
  .act-tab.active{ border-bottom:2px solid var(--amber); }
  .act-tab.active .act-tab-title{ color:var(--amber); }
  .act-num{
    font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--steel);
    width:20px; height:20px; border:1px solid var(--line); border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .act-tab.active .act-num{ border-color:var(--amber); color:var(--amber); }
  .act-tab.done .act-num{ background:var(--teal); border-color:var(--teal); color:var(--deep-space); font-size:11px; }
  .act-tab-title{ font-weight:600; font-size:13px; color:#DDE3E8; transition:color 0.2s; }
  .act-tab-sub{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--steel); display:none; }

  main{ padding-top:32px; }
  .eyebrow{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--amber); letter-spacing:0.08em; margin-bottom:10px; }
  .act-title{ font-size:2.2rem; margin-bottom:8px; }
  .act-question{ font-size:14.5px; color:var(--steel); margin-bottom:30px; }

  /* ── GRID / GLASS CARDS ─────────────────────────────────── */
  .grid{ display:grid; gap:16px; }
  .grid-3{ grid-template-columns:repeat(3, 1fr); }
  .grid-2{ grid-template-columns:1.3fr 1fr; }

  .card{
    background:rgba(18,24,31,0.85);
    backdrop-filter:blur(6px);
    border:1px solid rgba(42,53,66,0.6);
    border-radius:12px; padding:22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover{ border-color:rgba(232,163,61,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 0 22px rgba(232,163,61,0.06); }
  .card-tight{ padding:18px 20px; }
  .card-hero{ border-color:rgba(232,163,61,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 0 30px rgba(232,163,61,0.09); }
  .card-crimson{ border-color:rgba(196,67,43,0.45); }
  .card-teal{ border-color:rgba(63,167,150,0.4); }

  .kicker{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--steel); letter-spacing:0.06em; margin-bottom:8px; }
  .big-num{ font-family:'Archivo'; font-weight:900; font-size:3rem; line-height:1; letter-spacing:-0.02em; }
  .big-num.amber{ background:linear-gradient(135deg, #F4C066, var(--amber)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .big-num.teal{ background:linear-gradient(135deg, #6BD4C1, var(--teal)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .big-num.crimson{ color:var(--crimson); }
  .small-label{ font-size:12.5px; color:var(--steel); margin-top:8px; max-width:32ch; }

  /* ── SIGNAL BARS ─────────────────────────────────────────── */
  .signal-row{ display:flex; align-items:center; gap:12px; margin:9px 0; }
  .signal-name{ font-family:'IBM Plex Mono'; font-size:11px; width:76px; flex-shrink:0; color:var(--steel); }
  .signal-track{ flex:1; height:8px; border-radius:4px; background:rgba(139,154,168,0.12); overflow:hidden; position:relative; }
  .signal-fill{ height:100%; border-radius:4px; }
  .signal-fill.high{ background:linear-gradient(90deg, var(--teal), #6BD4C1); box-shadow:0 0 10px rgba(63,167,150,0.5); }
  .signal-fill.low{ background:var(--steel); opacity:0.5; }
  .signal-track.na{ background-image:repeating-linear-gradient(90deg, rgba(139,154,168,0.3) 0 6px, transparent 6px 12px); background-color:transparent; }
  .signal-val{ font-family:'IBM Plex Mono'; font-size:11px; width:56px; text-align:right; flex-shrink:0; }
  .signal-val.high{ color:var(--teal); }
  .signal-val.low{ color:var(--steel); }
  .signal-val.na{ color:var(--steel); opacity:0.5; }

  /* ── BADGES ─────────────────────────────────────────────── */
  .sig-dot{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono'; font-size:11px; font-weight:600; }
  .sig-dot.high{ color:var(--teal); }
  .sig-dot.low{ color:var(--steel); }
  .sig-dot.na{ color:var(--steel); opacity:0.5; }
  .sig-dot .pulse-dot{ animation:pulseDot 2s infinite; }

  .det-badge{ font-family:'IBM Plex Mono'; font-size:10.5px; padding:3px 9px; border-radius:5px; letter-spacing:0.03em; font-weight:600; border:1px solid; }
  .det-fraudar{ background:rgba(232,163,61,0.12); color:var(--amber); border-color:rgba(232,163,61,0.35); }
  .det-copycatch{ background:rgba(196,67,43,0.12); color:#E28066; border-color:rgba(196,67,43,0.35); }
  .det-flowscope{ background:rgba(63,167,150,0.12); color:var(--teal); border-color:rgba(63,167,150,0.35); }

  /* ── PRIORITY STAMP ─────────────────────────────────────── */
  .stamp{
    display:inline-block; font-family:'IBM Plex Mono'; font-weight:700; font-size:12px;
    letter-spacing:0.06em; padding:6px 14px; border:2px solid currentColor; border-radius:3px;
    position:relative; text-transform:uppercase;
  }
  .stamp::after{ content:''; position:absolute; inset:-4px; border:1px solid currentColor; border-radius:5px; opacity:0.3; }
  .stamp-p1{ color:var(--crimson); transform:rotate(-2deg); }
  .stamp-p2{ color:var(--amber); transform:rotate(0deg); }
  .stamp-p3{ color:var(--steel); transform:rotate(2deg); }
  .stamp-ok{ color:var(--teal); transform:rotate(-1deg); }
  .stamp-warn{ color:var(--crimson); transform:rotate(-2deg); }

  /* ── BUTTONS ────────────────────────────────────────────── */
  button.btn, a.btn{
    font-family:'IBM Plex Mono'; font-size:12.5px; font-weight:500; color:var(--deep-space);
    background:var(--amber); border:none; padding:11px 18px; border-radius:6px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition:transform 0.2s ease, box-shadow 0.2s ease;
  }
  button.btn:hover{ transform:translateY(-2px); box-shadow:0 6px 18px rgba(232,163,61,0.28); }
  button.btn.secondary{ background:transparent; color:#DDE3E8; border:1px solid var(--line); }
  button.btn.secondary:hover{ box-shadow:0 6px 16px rgba(0,0,0,0.3); border-color:var(--amber); }

  /* ── TABLE ──────────────────────────────────────────────── */
  table{ width:100%; border-collapse:collapse; font-size:12.8px; }
  th{ text-align:left; font-family:'IBM Plex Mono'; font-size:10.2px; color:var(--steel); letter-spacing:0.05em; padding:9px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px 10px; border-bottom:1px solid rgba(42,53,66,0.5); vertical-align:middle; }
  tr.qrow{ cursor:pointer; transition:background 0.15s; }
  tr.qrow:hover{ background:rgba(232,163,61,0.045); }

  .footnote{ font-size:11.5px; color:var(--steel); margin-top:12px; line-height:1.65; }
  .footnote b{ color:#DDE3E8; }

  select{ background:var(--panel); color:#DDE3E8; border:1px solid var(--line); border-radius:6px; padding:9px 12px; font-size:13px; width:100%; font-family:'IBM Plex Mono'; }

  /* ── FLOW DIAGRAM ───────────────────────────────────────── */
  .flow{ display:flex; align-items:center; gap:10px; font-family:'IBM Plex Mono'; font-size:12px; color:var(--steel); flex-wrap:wrap; justify-content:center; }
  .flow .node{ background:var(--panel); border:1px solid var(--line); padding:10px 16px; border-radius:8px; text-align:center; }
  .flow .arrow{ color:var(--line); font-size:16px; }

  /* ── MODE CARDS ─────────────────────────────────────────── */
  .mode-card{ cursor:pointer; }
  .mode-card.active{ border-color:var(--amber); box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 0 24px rgba(232,163,61,0.1); }
  .mode-name{ font-family:'Archivo'; font-weight:800; font-size:16px; margin-bottom:2px; }
  .mode-sub{ font-size:11.5px; color:var(--steel); margin-bottom:16px; }
  .mode-stat{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid rgba(42,53,66,0.5); font-size:12.5px; }
  .mode-stat:last-child{ border-bottom:none; }
  .mode-stat b{ font-family:'IBM Plex Mono'; }

  /* ── PAPER CARD ─────────────────────────────────────────── */
  .paper-inset{
    background:var(--paper); color:#2A2620; border-radius:10px; padding:22px 24px;
    font-family:'IBM Plex Mono'; font-size:12px; line-height:1.7;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  .paper-inset h4{ font-size:10.5px; letter-spacing:0.05em; margin:16px 0 5px; color:#6B4A2A; text-transform:uppercase; }
  .paper-inset h4:first-child{ margin-top:0; }
  .paper-badge{ display:inline-block; font-size:10px; background:#2A2620; color:var(--paper); padding:4px 9px; border-radius:4px; margin-bottom:14px; letter-spacing:0.04em; }
  .paper-inset .quickview{ background:rgba(42,38,32,0.06); border-left:3px solid #6B4A2A; padding:11px 13px; margin-bottom:14px; font-size:11.5px; }
  .paper-inset .quickview div{ margin:3px 0; }
  .paper-inset ul{ margin:4px 0 0 16px; }
  .paper-hr{ border:none; border-top:1px solid rgba(42,38,32,0.18); margin:12px 0; }

  /* ── GUARDRAIL ──────────────────────────────────────────── */
  .guardrail{
    display:flex; gap:12px; align-items:flex-start;
    background:rgba(232,163,61,0.06); border:1px solid rgba(232,163,61,0.3);
    border-radius:8px; padding:14px 16px; font-size:12.5px; color:#E9D9B8; margin-top:16px; line-height:1.6;
  }
  .guardrail .gi{ color:var(--amber); font-size:15px; flex-shrink:0; }

  .before-after{ display:grid; grid-template-columns:1fr auto 1fr; gap:18px; align-items:stretch; }
  .ba-col{ border:1px solid var(--line); border-radius:10px; padding:18px; background:var(--panel); }
  .ba-col.after{ border-color:rgba(196,67,43,0.4); }
  .ba-label{ font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:0.06em; color:var(--steel); margin-bottom:12px; }
  .ba-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid rgba(42,53,66,0.5); font-size:12.8px; }
  .ba-row:last-child{ border-bottom:none; }
  .ba-arrow-mid{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--line); font-size:22px; }

  .section-label{ font-family:'IBM Plex Mono'; font-size:10.8px; letter-spacing:0.05em; color:var(--steel); margin:26px 0 12px; }
  .section-label:first-child{ margin-top:0; }

  /* ── PULSE (used on active/selected items only) ─────────── */
  @keyframes pulseDot{
    0%{ opacity:1; } 50%{ opacity:0.25; } 100%{ opacity:1; }
  }
  .pulse-ring{ position:relative; }
  .pulse-ring::before{
    content:''; position:absolute; inset:-6px; border-radius:inherit;
    border:1px solid var(--amber); opacity:0; animation:pulseRing 2s ease-out infinite;
  }
  @keyframes pulseRing{
    0%{ opacity:0.5; transform:scale(0.97); }
    70%{ opacity:0; transform:scale(1.08); }
    100%{ opacity:0; transform:scale(1.08); }
  }

  @media (max-width: 980px){
    .grid-3, .grid-2, .before-after{ grid-template-columns:1fr; }
    .act-tab-sub{ display:none; }
    .big-num{ font-size:2.3rem; }
    .brand .name{ font-size:22px; }
  }
  @media (max-width: 600px){
    .brand .name{ font-size:18px; }
    .brand .tag{ font-size:9px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <div class="logo-mark">
          <div class="outer-ring"></div>
          <div class="inner-ring"></div>
          <div class="center-dot"></div>
          <div class="line-h"></div>
          <div class="line-v"></div>
          <div class="node node-tl"></div>
          <div class="node node-tr"></div>
          <div class="node node-bl"></div>
          <div class="node node-br"></div>
          <div class="node node-l"></div>
          <div class="node node-r"></div>
          <div class="node node-t"></div>
          <div class="node node-b"></div>
        </div>
      </div>
      <div class="name-group">
        <div class="name">CORTEX</div>
        <div class="tag">FRAUD INVESTIGATION CONSOLE</div>
      </div>
    </div>
    <div class="ticker">
      <span><span class="dot">●</span> <b id="tk-alerts">0</b> alerts</span>
      <span>→ <b id="tk-cases">0</b> cases</span>
      <span>→ <b id="tk-exposure">₹0</b> exposure identified</span>
      <span>→ <b id="tk-invest">5</b> investigators</span>
    </div>
  </header>

  <nav class="acts" id="acts"></nav>
  <main id="main"></main>
</div>

<script>
/* Data — identical to the pipeline's own frozen run output. */
const QUEUE = [
  {rank:1, det:'flowscope', archetype:'Circular-flow laundering', n:4, exposure:75536.10, conf:0.877, selected:true},
  {rank:2, det:'flowscope', archetype:'Circular-flow laundering', n:4, exposure:67464.47, conf:0.889, selected:true},
  {rank:3, det:'flowscope', archetype:'Circular-flow laundering', n:5, exposure:82925.16, conf:0.79, selected:true},
  {rank:4, det:'flowscope', archetype:'Circular-flow laundering', n:4, exposure:63730.32, conf:0.783, selected:true},
  {rank:5, det:'flowscope', archetype:'Circular-flow laundering', n:8, exposure:113901.92, conf:0.668, selected:true},
  {rank:6, det:'fraudar', archetype:'Shared-infrastructure promo-abuse', n:21, exposure:187260.05, conf:1.0, selected:true},
  {rank:7, det:'flowscope', archetype:'Circular-flow laundering', n:5, exposure:34766.31, conf:0.849, selected:true},
  {rank:8, det:'fraudar', archetype:'Shared-infrastructure promo-abuse', n:5, exposure:33722.86, conf:0.8, selected:true},
  {rank:9, det:'copycatch', archetype:'Lockstep chargeback ring', n:7, exposure:45975.30, conf:0.894, selected:true},

const GEMINI_MODEL = 'gemini-3.6-flash';
const GEMINI_SYSTEM_INSTRUCTION = `You are CORTEX's AI Investigation Co-Pilot. You help a human fraud investigator work a case that a deterministic system has already prioritized -- you do not re-prioritize it, re-score it, or decide anything the upstream system already decided.

CRITICAL RULES:
1. You do NOT decide, recompute, or alter any fraud score, confidence level, Rs exposure amount, or priority level. These are fixed facts from a deterministic system upstream of you.
2. The "evidence gaps," "similar historical cases," "why this priority," and "what would change confidence" fields given to you below are ALREADY COMPUTED by fixed rules, not by you. Your job is to narrate them clearly, not to invent additional gaps, pick different similar cases, or restate the priority reasoning in a way that contradicts what's given.
3. You do NOT invent facts, account numbers, or evidence not given to you. If evidence doesn't cover something, say so.
4. Every claim must be traceable to the evidence provided.
5. Keep the boundary between EVIDENCE (what a detector observed), INTERPRETATION (what the deterministic rule concluded from it), and RECOMMENDATION (what you suggest doing next) visible and distinct -- never blend a recommendation into a sentence describing evidence.

Produce a co-pilot briefing with EXACTLY these six labeled sections (kept concise for a live demo):

1. WHY THIS CASE IS SUSPICIOUS -- synthesize the given signals in plain English.
2. CONTRADICTIONS & UNCERTAINTY -- state plainly whether the given signals agree or disagree, using only what's given.
3. WHY THIS PRIORITY -- narrate the exact priority reason given to you; do not invent a different justification.
4. WHAT WOULD CHANGE MY MIND -- narrate the fixed "confidence driver" text given to you.
5. RECOMMENDED NEXT STEPS -- use the specific, case-derived steps given to you; do not replace them with generic advice.
6. BRIEFING SUMMARY -- 3-5 sentences for a busy investigator who may only read this section, ending with the bottom-line recommendation given to you.`;

function buildGeminiPrompt(c){
  const gapsText = c.gaps.map(g => `- ${g}`).join('\n');
  const stepsText = c.next_steps.map(s => `- ${s}`).join('\n');
  return `CASE EVIDENCE (fixed, do not change):
FRAUDAR: ${c.fraudar}
CopyCatch: ${c.copycatch}
FlowScope: ${c.flowscope}
Interpretation: ${c.interpretation}
Confidence: ${c.confidence}
What would change confidence: ${c.confidence_driver}
Rs Exposure: ${Math.round(c.exposure).toLocaleString('en-IN')}
Priority: ${c.priority}
Why this priority: ${c.priority_reason}

EVIDENCE GAPS (fixed list, narrate only these):
${gapsText}

SIMILAR HISTORICAL CASES (fixed comparison, narrate only this):
${c.similar}

RECOMMENDED NEXT STEPS (fixed, case-derived list -- use these, don't replace with generic advice):
${stepsText}

BOTTOM LINE (fixed, include in your summary):
${c.bottom_line}

Produce the six-section co-pilot briefing now.`;
}

const liveBriefings = {}; // caseId -> { text, model } cache so switching cases doesn't re-call the API
let liveCallInFlight = false;
let cachedApiKey = ''; // kept in memory only (not persisted to disk) so the field survives re-renders

async function generateLiveBriefing(caseId){
  const keyInput = document.getElementById('gemini-key-input');
  const apiKey = keyInput ? keyInput.value.trim() : cachedApiKey;
  cachedApiKey = apiKey;
  const statusEl = document.getElementById('live-briefing-status');
  if(!apiKey){
    if(statusEl) statusEl.textContent = 'Enter a Gemini API key first (from aistudio.google.com).';
    return;
  }
  if(liveCallInFlight) return;
  liveCallInFlight = true;
  if(statusEl) statusEl.textContent = `Calling ${GEMINI_MODEL}...`;
  render();

  const c = CASES[caseId];
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
  const payload = {
    system_instruction: { parts: [{ text: GEMINI_SYSTEM_INSTRUCTION }] },
    contents: [{ role: 'user', parts: [{ text: buildGeminiPrompt(c) }] }]
  };

  try {
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify(payload)
    });
    const data = await resp.json();
    if(!resp.ok){
      throw new Error(data?.error?.message || `HTTP ${resp.status}`);
    }
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('No text returned in response.');
    liveBriefings[caseId] = { text, model: GEMINI_MODEL };
  } catch (err) {
    liveBriefings[caseId] = { error: err.message || String(err) };
  } finally {
    liveCallInFlight = false;
    render();
  }
}

// Global markdown formatter function
function formatBriefing(text) {
  let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
  
  // Headers (### 1. Title)
  html = html.replace(/^### (.+)$/gm, '<h4 style="color:#6B4A2A; margin:14px 0 6px; font-size:12.5px; font-weight:700; letter-spacing:0.03em;">$1</h4>');
  
  // Bold (**text**)
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  
  // Italic (*text* - but not bullet points)
  html = html.replace(/(?<!\n)\*(.+?)\*(?!\n)/g, '<em>$1</em>');
  
  // Bullet lists (* item)
  html = html.replace(/^\* (.+)$/gm, '<li style="margin-left:20px; padding:1px 0;">$1</li>');
  html = html.replace(/((?:<li>.+<\/li>\n?)+)/g, '<ul style="margin:6px 0 10px; list-style-type:disc; padding-left:0;">$1</ul>');
  
  // Horizontal rules (---)
  html = html.replace(/^---$/gm, '<hr style="border:none; border-top:1px solid rgba(42,38,32,0.12); margin:12px 0;">');
  
  // Newlines to <br>
  html = html.replace(/\n/g, '<br>');
  
  // Clean up excessive breaks
  html = html.replace(/<br><br><br>/g, '<br><br>');
  html = html.replace(/<br><br><h4/g, '<br><h4');
  
  return html;
}

function countUp(id, target, isCurrency, duration=900){
  const el = document.getElementById(id);
  if(!el) return;
  const start = performance.now();
  function frame(now){
    const p = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-p, 3);
    const val = target * eased;
    el.textContent = isCurrency ? fmtRs(val) : Math.round(val).toLocaleString('en-IN');
    if(p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

          const liveBlock = isLive ? `
            <div style="font-size:11.5px; background:rgba(42,38,32,0.04); padding:12px 14px; border-radius:6px; margin-bottom:16px; line-height:1.7; color:#2A2620; max-height:600px; overflow-y:auto; display:none;">
              ${formatBriefing(live.text)}
            </div>
            <hr class="paper-hr" style="display:none;">` : '';

          return badge + controls + liveBlock;
        })()}
        <div class="quickview">
          <div><b>EVIDENCE:</b> FRAUDAR ${c.fraudar} · CopyCatch ${c.copycatch} · FlowScope ${c.flowscope}</div>
          <div><b>INTERPRETATION:</b> ${c.confidence} confidence, ${c.priority} priority</div>

    <div class="guardrail"><span class="gi">⚠</span><div>The AI layer never decides the score, exposure, or priority above — those come fixed from the deterministic reasoning engine. Its only job is turning that evidence into prose, and reading it back through a guardrail that checks it never asserts a different priority than the one actually assigned.</div></div>
    <div style="margin-top:28px;"><button class="btn" onclick="goTo(4)">What if this attacker adapts? →</button></div>

}

async function askCopilot(caseId) {
  const questionInput = document.getElementById('copilot-question');
  const question = questionInput.value.trim();
  if (!question) {
    document.getElementById('copilot-response').style.display = 'block';
    document.getElementById('copilot-response').innerHTML = 'Please enter a question first.';
    return;
  }
  
  const keyInput = document.getElementById('gemini-key-input');
  const apiKey = keyInput ? keyInput.value.trim() : cachedApiKey;
  if (!apiKey) {
    document.getElementById('copilot-response').style.display = 'block';
    document.getElementById('copilot-response').innerHTML = 'Please paste your Gemini API key in the field above first.';
    return;
  }
  
  document.getElementById('copilot-response').style.display = 'block';
  document.getElementById('copilot-response').innerHTML = 'Thinking...';
  
  const c = CASES[caseId];
  const prompt = `You are CORTEX's AI Investigation Co-Pilot. You're helping an investigator analyze this case.

CASE CONTEXT (these are fixed facts from the system, do not change them):
- FRAUDAR: ${c.fraudar}
- CopyCatch: ${c.copycatch}
- FlowScope: ${c.flowscope}
- Confidence: ${c.confidence}
- Priority: ${c.priority}
- Exposure: ₹${Math.round(c.exposure).toLocaleString('en-IN')}
- Interpretation: ${c.interpretation}
- Evidence gaps: ${c.gaps.join('; ')}
- Similar cases: ${c.similar}
- Next steps in system: ${c.next_steps.join('; ')}

The investigator asks: "${question}"

Rules:
1. You can only reference evidence provided above
2. You cannot change or invent scores, priorities, or exposure amounts
3. Be concise and helpful
4. If the question asks about something not in the evidence, say "I don't have that information in the case file"
5. Suggest specific actions the investigator can take
6. Use markdown formatting (**bold** for emphasis, bullet points for lists)

Respond in plain English with markdown formatting.`;
  
  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`;
    const resp = await fetch(url, {
      method: 'POST',
      headers: { 
        'Content-Type': 'application/json', 
        'x-goog-api-key': apiKey 
      },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: prompt }] }]
      })
    });
    const data = await resp.json();
    if (!resp.ok) {
      if (resp.status === 404) {
        throw new Error('Model not found. Try using gemini-1.5-flash instead.');
      }
      throw new Error(data?.error?.message || `HTTP ${resp.status}`);
    }
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from the model.';
    document.getElementById('copilot-response').innerHTML = formatBriefing(text);
  } catch (err) {
    document.getElementById('copilot-response').innerHTML = `Error: ${err.message}`;
  }
}
